<script>
(()=>{const K='blue-nook-html:v1',S=[0,100,300,650,1100],SN=['Крошка','Маленький исследователь','Растущий котёнок','Юный кот','Верный спутник'];let d={name:'Облачко',tasks:[],focus:[],sounds:true},tag='Паблик',filter='all',tagF='Паблик',mins=25,left=1500,running=false,target=0,month=new Date(new Date().getFullYear(),new Date().getMonth(),1);try{d={...d,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{}const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(d)),day=x=>new Date(x).toLocaleDateString('sv-SE'),today=()=>day(new Date());

function render(){const pencil='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>',trash='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m4 4v7m6-7v7"/></svg>';let list=d.tasks.filter(x=>(filter==='all'||(filter==='done'?x.done:!x.done))&&x.tag===tagF);$('taskList').innerHTML=list.length?list.map(x=>`<article class="task ${x.done?'done':''}" data-id="${x.id}"><div class="task-main"><p></p></div><button class="task-icon edit" aria-label="Изменить">${pencil}</button><button class="task-icon delete" aria-label="Удалить">${trash}</button></article>`).join(''):'<div class="empty"><span>Тихо и свободно</span><p>В этой категории пока нет дел.</p></div>';[...$('taskList').querySelectorAll('.task')].forEach((el,i)=>{let x=list[i];el.querySelector('p').textContent=x.text;el.onclick=()=>{x.done=!x.done;x.completedAt=x.done?new Date().toISOString():null;save();render();stats();pet();if(x.done){beep(true);react('Мур, ещё одно дело готово!')}};el.querySelector('.delete').onclick=e=>{e.stopPropagation();d.tasks=d.tasks.filter(t=>t.id!==x.id);save();render();stats();pet()};el.querySelector('.edit').onclick=e=>{e.stopPropagation();let v=prompt('Изменить задачу',x.text);if(v&&v.trim()){x.text=v.trim();save();render()}}});$('activeCount').textContent=d.tasks.filter(x=>!x.done&&x.tag===tagF).length+' активных'}
function stats(){let t=today(),tasks=d.tasks.filter(x=>x.completedAt&&day(x.completedAt)===t),f=d.focus.filter(x=>day(x.completedAt)===t);$('doneToday').textContent=tasks.length;$('sessionsToday').textContent=f.length;$('minutesToday').textContent=f.reduce((n,x)=>n+x.minutes,0)+' м';calendar()}
function add(){let v=$('taskInput').value.trim();if(!v)return;d.tasks.unshift({id:Date.now()+'',text:v,tag:tagF==='Сегодня'?'Сегодня':tag,done:false,createdAt:new Date().toISOString(),completedAt:null});$('taskInput').value='';save();render();beep()}
function calendar(){let first=new Date(month.getFullYear(),month.getMonth(),1),off=(first.getDay()+6)%7,n=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();$('monthTitle').textContent=month.toLocaleDateString('ru-RU',{month:'long'})+' '+month.getFullYear();$('calendar').innerHTML=Array.from({length:42},(_,i)=>{let z=i-off+1;if(z<1||z>n)return'<span></span>';let dt=new Date(month.getFullYear(),month.getMonth(),z),k=day(dt),score=d.tasks.filter(x=>x.completedAt&&day(x.completedAt)===k).length+d.focus.filter(x=>day(x.completedAt)===k).length;return`<button data-day="${k}" class="${k===today()?'today':''}"><span>${z}</span>${score?`<i data-level="${Math.min(3,score)}"></i>`:''}</button>`}).join('');[...$('calendar').querySelectorAll('button')].forEach(b=>b.onclick=()=>{let k=b.dataset.day,ts=d.tasks.filter(x=>x.completedAt&&day(x.completedAt)===k),fs=d.focus.filter(x=>day(x.completedAt)===k),box=$('dayDetail');box.hidden=false;box.innerHTML=`<button class="close">Закрыть</button><b>${new Date(k+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</b><p>${ts.length} дел · ${fs.length} сессий · ${fs.reduce((n,x)=>n+x.minutes,0)} минут</p>`;box.querySelector('.close').onclick=()=>box.hidden=true})}
function timer(){return}
